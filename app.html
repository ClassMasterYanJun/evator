<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эвотор - Ручная загрузка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            white-space: normal;
            word-wrap: break-word;
        }
        
        option {
            white-space: normal;
            word-wrap: break-word;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            padding: 15px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .load-btn {
            background-color: #4CAF50;
            color: white;
        }
        
        .load-btn:hover {
            background-color: #45a049;
        }
        
        .upload-btn {
            background-color: #008CBA;
            color: white;
        }
        
        .upload-btn:hover {
            background-color: #007B9A;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
        
        .status.success {
            background-color: #dff0d8;
            color: #3c763d;
            display: block;
        }
        
        .status.error {
            background-color: #f2dede;
            color: #a94442;
            display: block;
        }
        
        /* Адаптивный дизайн для мобильных устройств */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
        
        .period-group {
            display: flex;
            gap: 10px;
        }
        
        .period-group .form-group {
            flex: 1;
        }
        
        @media (max-width: 600px) {
            .period-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

        <h1>Эвотор - Ручная загрузка</h1>
        
        <div class="form-group">
            <label for="kkm">Выберете кассу:</label>
            <select id="kkm">
                <option value="">Загрузка данных...</option>
            </select>
        </div>
        
        <div class="period-group">
            <div class="form-group">
                <label for="startDate">Дата начала:</label>
                <input type="date" id="startDate">
            </div>
            
            <div class="form-group">
                <label for="endDate">Дата окончания:</label>
                <input type="date" id="endDate">
            </div>
        </div>
        
        <div class="button-group">
            <button class="load-btn" id="loadDataBtn">Загрузить данные о товарах</button>
            <button class="upload-btn" id="uploadDataBtn">Выгрузить документы продажи</button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

        // Функция для загрузки данных о кассах ККМ
        function loadKKMData() {
            try {
                const select = document.getElementById('kkm');
                select.innerHTML = '';
                
                kkmData.forEach(item => {
                    const option = document.createElement('option');
                    option.value = item['Касса ККМ'];
                    option.textContent = item['Наименование'];
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                showStatus('Ошибка загрузки данных о кассах ККМ', 'error');
            }
        }
        
        // Функция для отображения статуса
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = 'status ' + type;
        }
        
        // Функция для получения выбранного периода
        function getSelectedPeriod() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            
            return { startDate, endDate };
        }
        
        // Обработчик кнопки "Загрузить данные о товарах"
        document.getElementById('loadDataBtn').addEventListener('click', () => {
            const selectedKKM = document.getElementById('kkm').value;
            const period = getSelectedPeriod();
            
            if (!selectedKKM) {
                showStatus('Пожалуйста, выберите кассу ККМ', 'error');
                return;
            }
            
            if (!period.startDate || !period.endDate) {
                showStatus('Пожалуйста, выберите период', 'error');
                return;
            }
            
            // Здесь будет логика загрузки данных о товарах
            showStatus(`Загрузка данных о товарах для кассы: ${selectedKKM}`, 'success');
            console.log('Загрузка данных о товарах для:', selectedKKM, period);
        });
        
        // Обработчик кнопки "Выгрузить документы продажи"
        document.getElementById('uploadDataBtn').addEventListener('click', () => {
            const selectedKKM = document.getElementById('kkm').value;
            const period = getSelectedPeriod();
            
            if (!selectedKKM) {
                showStatus('Пожалуйста, выберите кассу ККМ', 'error');
                return;
            }
            
            if (!period.startDate || !period.endDate) {
                showStatus('Пожалуйста, выберите период', 'error');
                return;
            }
            
            // Здесь будет логика выгрузки документов продажи
            showStatus(`Выгрузка документов продажи для кассы: ${selectedKKM}`, 'success');
            console.log('Выгрузка документов продажи для:', selectedKKM, period);
        });
        
        // Установка текущей даты по умолчанию
        function setDefaultDates() {
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            
            document.getElementById('startDate').valueAsDate = firstDay;
            document.getElementById('endDate').valueAsDate = today;
        }
        
        // Инициализация приложения
        window.addEventListener('DOMContentLoaded', () => {
            loadKKMData();
            setDefaultDates();
        });

</html>
